name: CI/CD Pipeline
  
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: lint-and-test
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Clone the repository into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install and configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          pip install ruff pytest

      # Step 4: Run the linter
      - name: Lint Code
        run: ruff check .

      # Step 5: Run python tests
      - name: Run tests
        run: pytest

  build-and-push-to-GHCR:
    name: Build & push docker image
    needs: ci # runs only if ci passes
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN}}

      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/jedifromohio/ps-price-tracker:latest
            ghcr.io/jedifromohio/ps-price-tracker:${{ github.sha }}

  deploy:
    name: Deploy to EC2 via AWS SSM
    needs: build-and-push-to-GHCR
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Execute deployment via AWS SSM
        run: |
          aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploying new scraper image from GHCR" \
          --parameters 'commands=[
            "docker pull ghcr.io/jedifromohio/ps-price-tracker:latest",
            "docker image prune -f"
            ]'\
          --output text
